name: branch-repair

on:
  push:
    branches:
      - build/rust-workcell-foundation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: build/rust-workcell-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Repair Discovery fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path("crates").rglob("*.rs"):
              lines = path.read_text().splitlines(keepends=True)
              out = []
              changed = False
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if "Discovery {" not in line or "struct Discovery" in line:
                      out.append(line)
                      i += 1
                      continue

                  block = [line]
                  depth = line.count("{") - line.count("}")
                  i += 1
                  while i < len(lines) and depth > 0:
                      current = lines[i]
                      block.append(current)
                      depth += current.count("{") - current.count("}")
                      i += 1

                  if any("capacity:" in item for item in block):
                      out.extend(block)
                      continue

                  offers_index = next(
                      (index for index, item in enumerate(block) if item.lstrip().startswith("offers:")),
                      None,
                  )
                  if offers_index is not None:
                      offers_line = block[offers_index]
                      indent = offers_line[: len(offers_line) - len(offers_line.lstrip())]
                      block.insert(
                          offers_index,
                          f"{indent}capacity: std::collections::BTreeMap::new(),\n",
                      )
                      changed = True

                  out.extend(block)

              if changed:
                  path.write_text("".join(out))
          PY
          cargo fmt --all
      - name: Verify assembled Workcell tree
        id: verify
        shell: bash
        run: |
          set +e
          ./scripts/verify.sh > /tmp/workcell-verify.log 2>&1
          code=$?
          set -e
          rm -rf .ci-helper
          if [ "$code" -ne 0 ]; then
            mkdir -p .ci-helper
            {
              printf 'verify: FAIL (exit=%s)\n\n' "$code"
              tail -n 240 /tmp/workcell-verify.log
            } > .ci-helper/FAIL
          fi
          printf 'code=%s\n' "$code" >> "$GITHUB_OUTPUT"
      - name: Commit repaired branch and retire helper
        shell: bash
        run: |
          rm -f .github/workflows/branch-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: complete Workcell assembly verification"
            git push origin HEAD:build/rust-workcell-foundation
          fi
      - name: Fail when repository gate still fails
        if: steps.verify.outputs.code != '0'
        run: exit 1
