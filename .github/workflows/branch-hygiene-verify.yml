name: branch-hygiene-verify

on:
  push:
    branches:
      - build/rust-workcell-foundation

permissions:
  contents: write

jobs:
  clean-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: build/rust-workcell-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Remove generated branch artifacts
        run: |
          git rm -r --ignore-unmatch target .ci-helper
          cat > .gitignore <<'EOF'
          /target/
          /.ci-helper/
          EOF
      - name: Verify clean product tree
        run: ./scripts/verify.sh
      - name: Commit hygiene cleanup and retire helper
        run: |
          rm -f .github/workflows/branch-hygiene-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove generated Cargo artifacts from Workcell branch"
          git push origin HEAD:build/rust-workcell-foundation
