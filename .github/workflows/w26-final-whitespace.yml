name: W26 final whitespace fix

on:
  push:
    branches:
      - feat/opensandbox-world-hosting-43

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/opensandbox-world-hosting-43
          fetch-depth: 1
      - name: Remove trailing whitespace from source integration record
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/OPENSANDBOX-SOURCE-INTEGRATION.md')
          lines = path.read_text().splitlines()
          path.write_text('\n'.join(line.rstrip() for line in lines) + '\n')
          PY
          git diff --check
      - name: Commit when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/OPENSANDBOX-SOURCE-INTEGRATION.md
          git commit -m "W26: remove source-record trailing whitespace"
          git push origin HEAD:feat/opensandbox-world-hosting-43
