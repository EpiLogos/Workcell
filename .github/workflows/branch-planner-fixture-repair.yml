name: branch-planner-fixture-repair

on:
  push:
    branches:
      - build/rust-workcell-foundation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: build/rust-workcell-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Repair legacy planner Discovery fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("crates/workcell-core/tests/planning_requirements.rs"),
              Path("crates/workcell-core/tests/planning_composition.rs"),
              Path("crates/workcell-core/tests/planning_degradation.rs"),
          ]
          needle = "        health: HealthState::Healthy,\n        offers,\n"
          replacement = (
              "        health: HealthState::Healthy,\n"
              "        capacity: BTreeMap::new(),\n"
              "        offers,\n"
          )
          for path in paths:
              text = path.read_text()
              if "capacity: BTreeMap::new(),\n        offers," in text:
                  continue
              if needle not in text:
                  raise SystemExit(f"expected legacy Discovery fixture not found in {path}")
              path.write_text(text.replace(needle, replacement, 1))
          PY
          cargo fmt --all
      - name: Verify assembled Workcell tree
        id: verify
        shell: bash
        run: |
          set +e
          ./scripts/verify.sh > /tmp/workcell-verify.log 2>&1
          code=$?
          set -e
          rm -rf .ci-helper
          if [ "$code" -ne 0 ]; then
            mkdir -p .ci-helper
            {
              printf 'verify: FAIL (exit=%s)\n\n' "$code"
              tail -n 360 /tmp/workcell-verify.log
            } > .ci-helper/FAIL
          fi
          printf 'code=%s\n' "$code" >> "$GITHUB_OUTPUT"
      - name: Commit repair and retire helper
        shell: bash
        run: |
          rm -f .github/workflows/branch-planner-fixture-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: migrate planner Discovery fixtures"
            git push origin HEAD:build/rust-workcell-foundation
          fi
      - name: Fail when repository gate still fails
        if: steps.verify.outputs.code != '0'
        run: exit 1
