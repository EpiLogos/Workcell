name: Pre-local release

on:
  pull_request:
    paths:
      - '.oi/product.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/prelocal-release.yml'
  push:
    branches: [main]
    paths:
      - '.oi/product.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/prelocal-release.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets --locked

  artifact:
    if: github.event_name == 'push'
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build locked native artifact
        run: cargo build --locked --release --target '${{ matrix.target }}' --package epilogos-workcell-cli --bin workcell
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="workcell-0.1.0-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/workcell" "dist/$name/workcell"
          cp .oi/product.json "dist/$name/product.json"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: workcell-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    if: github.event_name == 'push'
    needs: artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: workcell-*
          path: dist
          merge-multiple: true
      - name: Publish immutable pre-local release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='workcell-v0.1.0-prelocal.2'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists; refusing to mutate an accepted release" >&2
            exit 1
          fi
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Workcell 0.1.0 pre-local.2' --notes 'Accepted O:I suite pre-local.2 artifact. Physical workstation/provider acceptance is not claimed.'
