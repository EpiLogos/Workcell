name: branch-rustfmt

on:
  push:
    branches:
      - build/rust-workcell-foundation

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/rust-workcell-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format branch
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: rustfmt Workcell branch"
          git push origin HEAD:build/rust-workcell-foundation
