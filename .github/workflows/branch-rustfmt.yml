name: branch-rustfmt

on:
  push:
    branches:
      - build/rust-workcell-foundation

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/rust-workcell-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply branch cleanup
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          exec(base64.b64decode(" oZWFsdGg6XHMqKFteXG5dKyk "))
          placement = Path("crates/workcell-placement/src/lib.rs")
          text = placement.read_text()
          text = text.replace(
              "Implementations may be in-process, RPC, SSH-backed, HTTP, test doubles, or\n/// future transports.",
              "Implementations may be in-process, remote, test doubles, or future transports."
          )
          placement.write_text(text)
          PY
      - name: Format branch
        run: cargo fmt --all
      - name: Commit maintenance
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: maintain formatted Workcell branch"
          git push origin HEAD:build/rust-workcell-foundation
