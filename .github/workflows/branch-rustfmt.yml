name: branch-rustfmt

on:
  push:
    branches:
      - build/rust-workcell-foundation

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/rust-workcell-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply branch cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/workcell-docker/tests/docker_providers.rs")
          text = path.read_text().replace("command.args.get(0)", "command.args.first()")
          path.write_text(text)
          PY
      - name: Format branch
        run: cargo fmt --all
      - name: Commit maintenance
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: maintain formatted Workcell branch"
          git push origin HEAD:build/rust-workcell-foundation
