name: branch-rustfmt

on:
  push:
    branches:
      - build/rust-workcell-foundation

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/rust-workcell-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply branch cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/workcell-docker/tests/docker_providers.rs")
          text = path.read_text().replace("command.args.get(0)", "command.args.first()")
          path.write_text(text)

          prepared = Path("crates/workcell-core/src/prepared.rs")
          text = prepared.read_text()
          text = text.replace(
              "plan, ArtifactStorageProvider, Binding, BindingPresence, CollectedOutput, CollectionBundle,",
              "plan, ArtifactStorageProvider, Binding, BindingPresence, Capacity, CollectedOutput, CollectionBundle,",
          )
          text = text.replace(
              "pub struct PreparedWorldControlPlane {\n    workcell_ref: WorkcellRef,\n    worlds:",
              "pub struct PreparedWorldControlPlane {\n    workcell_ref: WorkcellRef,\n    health: HealthState,\n    capacity: BTreeMap<String, Capacity>,\n    worlds:",
          )
          text = text.replace(
              "        Self {\n            workcell_ref,\n            worlds:",
              "        Self {\n            workcell_ref,\n            health: HealthState::Healthy,\n            capacity: BTreeMap::new(),\n            worlds:",
          )
          marker = "    pub fn register_world(&mut self, world: MaterialisedExecutionWorld) -> Result<()> {"
          methods = '''    pub fn with_discovery_state(
        mut self,
        health: HealthState,
        capacity: BTreeMap<String, Capacity>,
    ) -> Result<Self> {
        if capacity.keys().any(|key| key.trim().is_empty()) {
            return Err(WorkcellError::InvalidDemand(
                "Workcell discovery capacity keys must not be empty".into(),
            ));
        }
        self.health = health;
        self.capacity = capacity;
        Ok(self)
    }

    pub fn discovery_health(&self) -> &HealthState {
        &self.health
    }

    pub fn discovery_capacity(&self) -> &BTreeMap<String, Capacity> {
        &self.capacity
    }

'''
          if "pub fn with_discovery_state" not in text:
              text = text.replace(marker, methods + marker)
          text = text.replace(
              "            health: HealthState::Healthy,\n            offers,",
              "            health: self.health.clone(),\n            capacity: self.capacity.clone(),\n            offers,",
          )
          prepared.write_text(text)
          PY
      - name: Format branch
        run: cargo fmt --all
      - name: Commit maintenance
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: maintain formatted Workcell branch"
          git push origin HEAD:build/rust-workcell-foundation
