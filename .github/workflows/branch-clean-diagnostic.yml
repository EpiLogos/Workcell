name: branch-clean-diagnostic

on:
  push:
    branches:
      - build/rust-workcell-foundation

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: build/rust-workcell-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Run clean verification and persist exact failure
        shell: bash
        run: |
          rm -rf target
          set +e
          ./scripts/verify.sh > /tmp/workcell-verify.log 2>&1
          code=$?
          set -e

          rm -f .github/workflows/branch-clean-diagnostic.yml
          rm -rf .ci-debug
          if [ "$code" -ne 0 ]; then
            mkdir -p .ci-debug
            {
              printf 'clean-tree verify: FAIL (exit=%s)\n\n' "$code"
              cat /tmp/workcell-verify.log
            } > .ci-debug/FAIL
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci-debug/FAIL 2>/dev/null || true
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: record clean Workcell verification result"
            git push origin HEAD:build/rust-workcell-foundation
          fi

          exit "$code"
