name: CAW pinned source integration (one use)

on:
  push:
    branches: ['agent/caw-w9-material-lifecycle']
    paths: ['.github/workflows/caw-source-integration.yml']

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'EpiLogos/Workcell' && github.ref == 'refs/heads/agent/caw-w9-material-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact current branch and service-owner ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 71924dcbb2378630cd7364b960eacd97eb4e69f6
          git config user.name 'Workcell implementation'
          git config user.email 'workcell-implementation@users.noreply.github.com'
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$header" fetch --no-tags origin 499bf81be9d0eed8770f92e31ec7d29c15bce101
          git merge --no-commit --no-ff 499bf81be9d0eed8770f92e31ec7d29c15bce101
      - name: Apply exact tested source delta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          refs = ['30554595862e1e4fc9bd64a289648a0cd97d5b12', '1aef5670b14192ed665ec795ff075233c3020c01', '1224ae7630c2a7ca54a575a3fabb07acd2f43fb1', '471cb81c9fc7bd52bef6e2f6cf8f865384e771aa']
          parts = []
          for ref in refs:
              request = urllib.request.Request('https://api.github.com/repos/EpiLogos/Workcell/git/blobs/' + ref, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as stream:
                  document = json.load(stream)
              data = base64.b64decode(document['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == ref
              parts.append(data)
          delta = lzma.decompress(b''.join(parts))
          assert hashlib.sha256(delta).hexdigest() == '2c108355f86412e9163b540ff16abcbc98aeee99bd87e219591f44bcb90092d1'
          pathlib.Path('/tmp/caw-source.patch').write_bytes(delta)
          PY
          git apply --check /tmp/caw-source.patch
          git apply /tmp/caw-source.patch
          git add -- Cargo.lock crates/ docs/CAW-MATERIAL-OPERATIONS.md scripts/caw_native_campaign.py scripts/caw_installed_world.py
          git diff --cached --stat
          git commit -m 'feat(caw): durable material lifecycle, supplied write boundary and native campaigns (#72)'
      - name: Publish only the own implementation branch without force
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$header" push origin HEAD:refs/heads/agent/caw-w9-material-lifecycle
          git rev-parse HEAD
