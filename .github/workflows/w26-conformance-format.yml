name: W26 conformance normalize

on:
  push:
    branches:
      - feat/opensandbox-world-hosting-43

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/opensandbox-world-hosting-43
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix public contract import and format
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/workcell-opensandbox/tests/opensandbox_conformance.rs')
          text = path.read_text()
          text = text.replace(
              'AffordanceRequirement, Availability, DemandRef, DesiredMaterialState, ExecutionDemand,\n    ExecutionMaterialRequest, ExecutionProvider, ExternalRef, HealthState, MaterialCheckpointProvider,',
              'AffordanceRequirement, Availability, CheckpointRequest, DemandRef, DesiredMaterialState,\n    ExecutionDemand, ExecutionMaterialRequest, ExecutionProvider, ExternalRef, HealthState,\n    MaterialCheckpointProvider,'
          )
          text = text.replace(
              'compose_opensandbox_material_world, CheckpointRequest, OpenSandboxConfig,\n',
              'compose_opensandbox_material_world, OpenSandboxConfig,\n'
          )
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit normalized conformance test
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/workcell-opensandbox/tests/opensandbox_conformance.rs
          git commit -m "W26: normalize OpenSandbox conformance proof"
          git push origin HEAD:feat/opensandbox-world-hosting-43
