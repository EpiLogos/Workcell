name: Rustfmt diagnostic

on:
  push:
    branches:
      - agent/workcell-secret-materialisation

permissions:
  contents: read

jobs:
  rustfmt-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Materialise rustfmt delta
        shell: bash
        run: |
          cargo fmt --all
          git diff --patch > /tmp/rustfmt.patch
          cat /tmp/rustfmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: /tmp/rustfmt.patch
          if-no-files-found: error
