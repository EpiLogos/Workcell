name: Secret conformance

on:
  push:
    branches:
      - agent/workcell-secret-materialisation
    paths:
      - 'crates/workcell-core/**'
      - 'crates/workcell-runtime/**'
      - 'fixtures/varlock/**'
      - '.github/workflows/secret-conformance.yml'
  pull_request:
    paths:
      - 'crates/workcell-core/**'
      - 'crates/workcell-runtime/**'
      - 'fixtures/varlock/**'
      - '.github/workflows/secret-conformance.yml'

permissions:
  contents: read

jobs:
  provider-and-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}"..HEAD
      - name: Install exact Varlock version
        run: |
          npm install --global varlock@1.16.1
          varlock --version | tee /tmp/varlock-version.txt
          grep -q '1.16.1' /tmp/varlock-version.txt
      - name: Confirm Docker sandbox substrate
        run: docker version
      - name: Create device-local encrypted fixture value
        working-directory: fixtures/varlock
        shell: bash
        run: |
          set -euo pipefail
          output="$(printf '%s' 'd29ya2NlbGw6c2VjcmV0' | NO_COLOR=1 varlock encrypt)"
          encrypted="$(printf '%s\n' "$output" | sed -n 's/.*SOME_SENSITIVE_KEY=\(varlock.*\)$/\1/p' | tail -n 1)"
          test -n "$encrypted"
          printf 'HTTPBIN_BASIC=%s\n' "$encrypted" > .env.local
          test "$(grep -c 'varlock(' .env.local)" -eq 1
          ! grep -q 'd29ya2NlbGw6c2VjcmV0' .env.local
      - name: Validate strict broker rules without resolving secrets into output
        working-directory: fixtures/varlock
        run: varlock proxy rules
      - name: Prove real Varlock broker path against hostile instructions
        working-directory: fixtures/varlock
        shell: bash
        run: |
          set -o pipefail
          varlock proxy run -- sh ./adversarial-agent.sh 2>&1 | tee /tmp/varlock-adversarial.txt
          grep -q 'VARLOCK_BROKER_ADVERSARIAL_FIXTURE_OK' /tmp/varlock-adversarial.txt
          ! grep -q 'd29ya2NlbGw6c2VjcmV0' /tmp/varlock-adversarial.txt
      - name: Prove deny-by-default Docker material boundary
        working-directory: fixtures/varlock
        shell: bash
        run: |
          set -euo pipefail
          docker network create --internal workcell-secret-fixture >/dev/null
          trap 'docker network rm workcell-secret-fixture >/dev/null 2>&1 || true' EXIT
          docker run --rm \
            --network workcell-secret-fixture \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            -e HTTPBIN_BASIC=dummy_basic_fixture_value \
            -v "$PWD:/work:ro" \
            -w /work \
            buildpack-deps:bookworm-curl \
            sh ./sandbox-adversarial-agent.sh 2>&1 | tee /tmp/docker-adversarial.txt
          grep -q 'WORKCELL_DOCKER_ISOLATION_FIXTURE_OK' /tmp/docker-adversarial.txt
      - name: Upload provider diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-conformance-diagnostics
          path: |
            /tmp/varlock-version.txt
            /tmp/varlock-adversarial.txt
            /tmp/docker-adversarial.txt
          if-no-files-found: warn
      - name: Remove ephemeral encrypted fixture file
        if: always()
        run: rm -f fixtures/varlock/.env.local
