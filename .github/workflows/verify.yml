name: verify

on:
  push:
    branches:
      - build/rust-workcell-foundation

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: build/rust-workcell-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Repair typed plan outcomes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          material = Path("crates/workcell-core/src/contract/material.rs")
          text = material.read_text()
          text = text.replace(
              "    BindingRef, DemandRef, ExternalRef, HealthState, OfferRef, PersistenceScope, PlannedConstraint,\n    PlannedExposure, ProviderPortKind, ProviderRef, RequirementNecessity, RetentionExpectation,\n",
              "    BindingRef, Degradation, DemandRef, ExternalRef, HealthState, OfferRef, PersistenceScope,\n    PlanOmission, PlannedConstraint, PlannedExposure, ProviderPortKind, ProviderRef,\n    RequirementNecessity, RetentionExpectation,\n",
          )
          if "pub plan_degradations" not in text:
              text = text.replace(
                  "    pub planned_exposures: Vec<PlannedExposure>,\n    pub planned_constraints: Vec<PlannedConstraint>,\n",
                  "    pub planned_exposures: Vec<PlannedExposure>,\n    pub planned_constraints: Vec<PlannedConstraint>,\n    pub plan_degradations: Vec<Degradation>,\n    pub plan_omissions: Vec<PlanOmission>,\n",
              )
          material.write_text(text)

          compose = Path("crates/workcell-core/src/world/compose.rs")
          text = compose.read_text()
          if "plan_degradation_count" not in text:
              text = text.replace(
                  "    provenance.insert(\n        \"planned_constraint_count\".into(),\n        plan.planned_constraints.len().to_string(),\n    );\n",
                  "    provenance.insert(\n        \"planned_constraint_count\".into(),\n        plan.planned_constraints.len().to_string(),\n    );\n    provenance.insert(\"plan_degradation_count\".into(), plan.degradations.len().to_string());\n    provenance.insert(\"plan_omission_count\".into(), plan.omissions.len().to_string());\n",
              )
          if "plan_degradations: plan.degradations.clone()" not in text:
              text = text.replace(
                  "        planned_exposures: plan.planned_exposures.clone(),\n        planned_constraints: plan.planned_constraints.clone(),\n",
                  "        planned_exposures: plan.planned_exposures.clone(),\n        planned_constraints: plan.planned_constraints.clone(),\n        plan_degradations: plan.degradations.clone(),\n        plan_omissions: plan.omissions.clone(),\n",
              )
          compose.write_text(text)

          prepared = Path("crates/workcell-core/src/prepared.rs")
          text = prepared.read_text()
          if ".filter(|item| item.requirement.starts_with(\"exposure:\"))" not in text:
              text = text.replace(
                  "        let mut surfaces = Vec::new();\n        let mut degradations = Vec::new();\n        let mut omissions = Vec::new();\n\n        for planned in &world.planned_exposures {\n",
                  "        let mut surfaces = Vec::new();\n        let mut degradations = world\n            .plan_degradations\n            .iter()\n            .filter(|item| item.requirement.starts_with(\"exposure:\"))\n            .cloned()\n            .collect::<Vec<_>>();\n        let mut omissions = world\n            .plan_omissions\n            .iter()\n            .filter(|item| item.requirement.starts_with(\"exposure:\"))\n            .cloned()\n            .collect::<Vec<_>>();\n\n        for planned in &world.planned_exposures {\n",
              )
          if ".filter(|item| item.requirement.starts_with(\"output:\"))" not in text:
              text = text.replace(
                  "        let mut outputs = Vec::new();\n        let mut degradations = Vec::new();\n        let mut omissions = Vec::new();\n\n        for binding in world\n",
                  "        let mut outputs = Vec::new();\n        let mut degradations = world\n            .plan_degradations\n            .iter()\n            .filter(|item| item.requirement.starts_with(\"output:\"))\n            .cloned()\n            .collect::<Vec<_>>();\n        let mut omissions = world\n            .plan_omissions\n            .iter()\n            .filter(|item| item.requirement.starts_with(\"output:\"))\n            .cloned()\n            .collect::<Vec<_>>();\n\n        for binding in world\n",
              )
          prepared.write_text(text)
          PY
          rm -rf .ci-debug
          rm -f .github/workflows/branch-operation-outcome-repair.yml
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: retain plan-time expose and collect outcomes"
            git push origin HEAD:build/rust-workcell-foundation
          fi
      - name: Verify clean product tree
        run: |
          rm -rf target
          ./scripts/verify.sh
