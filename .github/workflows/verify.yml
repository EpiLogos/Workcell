name: verify

on:
  push:
    branches:
      - build/rust-workcell-foundation

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: build/rust-workcell-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Format and clean product source
        shell: bash
        run: |
          cargo fmt --all
          rm -rf .ci-debug .ci-helper
          rm -f .github/workflows/branch-operation-outcome-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: format and clean Workcell product tree"
            git push origin HEAD:build/rust-workcell-foundation
          fi
      - name: Verify cleaned tree
        run: |
          rm -rf target
          ./scripts/verify.sh
