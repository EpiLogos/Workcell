name: verify

# The one pull-request gate for Workcell (branch-required): the
# repository-owned scripts/verify.sh, once per change.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # SAME Source-pinned hosted staging exception as the native campaign.
  # This coordinate is job-owned evidence, not a native Project or Run.
  WORKCELL_TEST_ARTIFACT_ROOT: ${{ github.workspace }}/evidence/native-processes
  WORKCELL_TEST_ARTIFACT_ADMISSION: hosted-runner
  WORKCELL_TEST_ARTIFACT_OWNER_SOURCE: ${{ github.workspace }}/evidence/source-commit.txt

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true
      - name: Admit existing hosted native verification evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKCELL_TEST_ARTIFACT_ROOT"
          git rev-parse HEAD > evidence/source-commit.txt
          printf 'WORKCELL_TEST_ARTIFACT_OWNER_REF=%s\n' "$(cat evidence/source-commit.txt)" >> "$GITHUB_ENV"
      - run: ./scripts/verify.sh
