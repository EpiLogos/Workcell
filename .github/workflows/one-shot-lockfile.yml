name: one-shot Cargo lockfile

on:
  push:
    branches:
      - agent/workcell-inhabitable-finish

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/workcell-inhabitable-finish
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate lockfile and remove one-shot workflow
        run: |
          cargo generate-lockfile
          rm .github/workflows/one-shot-lockfile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/one-shot-lockfile.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: regenerate canonical Cargo lockfile'
          git push origin HEAD:agent/workcell-inhabitable-finish
