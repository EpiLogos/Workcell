name: branch-clippy-repair

on:
  push:
    branches:
      - build/rust-workcell-foundation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: build/rust-workcell-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Derive PlacementPolicy default
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/workcell-placement/src/lib.rs")
          text = path.read_text()
          text = text.replace(
              "#[derive(Clone, Debug, Eq, PartialEq)]\npub struct PlacementPolicy {",
              "#[derive(Clone, Debug, Default, Eq, PartialEq)]\npub struct PlacementPolicy {",
          )
          manual = '''\nimpl Default for PlacementPolicy {\n    fn default() -> Self {\n        Self {\n            required_tags: BTreeSet::new(),\n            max_locality_cost: None,\n            prefer_locality_over_capacity: false,\n            require_declared_aggregate_capacity: false,\n        }\n    }\n}\n'''
          if manual not in text:
              raise SystemExit("expected PlacementPolicy Default impl was not found")
          path.write_text(text.replace(manual, "\n"))
          PY
          cargo fmt --all
      - name: Verify assembled Workcell tree
        id: verify
        shell: bash
        run: |
          set +e
          ./scripts/verify.sh > /tmp/workcell-verify.log 2>&1
          code=$?
          set -e
          rm -rf .ci-helper
          if [ "$code" -ne 0 ]; then
            mkdir -p .ci-helper
            {
              printf 'verify: FAIL (exit=%s)\n\n' "$code"
              tail -n 260 /tmp/workcell-verify.log
            } > .ci-helper/FAIL
          fi
          printf 'code=%s\n' "$code" >> "$GITHUB_OUTPUT"
      - name: Commit repair and retire helper
        shell: bash
        run: |
          rm -f .github/workflows/branch-clippy-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: satisfy Workcell placement clippy gate"
            git push origin HEAD:build/rust-workcell-foundation
          fi
      - name: Fail when repository gate still fails
        if: steps.verify.outputs.code != '0'
        run: exit 1
