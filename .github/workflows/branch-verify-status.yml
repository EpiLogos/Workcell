name: branch-verify-status

on:
  push:
    branches:
      - build/rust-workcell-foundation

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/rust-workcell-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Run repository gate and record compact status
        run: |
          set +e
          ./scripts/verify.sh > /tmp/workcell-verify.log 2>&1
          code=$?
          set -e
          mkdir -p .ci-helper
          rm -f .ci-helper/PASS .ci-helper/FAIL
          if [ "$code" -eq 0 ]; then
            printf 'verify: PASS\n' > .ci-helper/PASS
          else
            {
              printf 'verify: FAIL (exit=%s)\n\n' "$code"
              tail -n 160 /tmp/workcell-verify.log
            } > .ci-helper/FAIL
          fi
      - name: Commit status when changed
        run: |
          if git diff --quiet -- .ci-helper; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-helper
          git commit -m "chore: record temporary branch verification status"
          git push origin HEAD:build/rust-workcell-foundation
