name: Pre-local build

# Attested workcell artifacts from main. verify.yml already gated the merge;
# this workflow does not test again.

on:
  push:
    branches: [main]
    paths:
      - '.oi/product.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/prelocal-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build locked native artifact
        run: cargo build --locked --release --target '${{ matrix.target }}' --package epilogos-workcell-cli --bin workcell
      - name: Package exact-main build artifact
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          # Artifact identity derives from the product manifest, never a
          # restated version string that rots between releases.
          version="$(node -p "require('./.oi/product.json').version")"
          name="workcell-${version}-${short_sha}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/workcell" "dist/$name/workcell"
          cp .oi/product.json "dist/$name/product.json"
          printf '%s\n' "$GITHUB_SHA" > "dist/$name/source-commit.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: workcell-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
