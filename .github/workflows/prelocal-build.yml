name: Pre-local build

# Attested workcell artifacts from main. verify.yml already gated the merge;
# this workflow does not test again.

on:
  push:
    branches: [main]
    paths:
      - '.oi/product.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/prelocal-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build locked native artifact
        env:
          SUITE_BUILD_REVISION: ${{ github.sha }}
        run: cargo build --locked --release --target '${{ matrix.target }}' --package epilogos-workcell-cli --bins
      - name: Package exact-main build artifact
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          # Artifact identity derives from the product manifest, never a
          # restated version string that rots between releases.
          version="$(node -p "require('./.oi/product.json').version")"
          name="workcell-${version}-${short_sha}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          # Ship the complete native package declaration, including the
          # companions resolved beside workcell by the managed installer.
          cargo metadata --locked --offline --no-deps --format-version 1 > "$RUNNER_TEMP/workcell-artifact-metadata.json"
          node - "$RUNNER_TEMP/workcell-artifact-metadata.json" <<'NODE' > "$RUNNER_TEMP/workcell-artifact-binaries.txt"
          const metadata = require(process.argv[2]);
          const pkg = metadata.packages.find(pkg => pkg.name === 'epilogos-workcell-cli');
          if (!pkg) throw new Error('native Workcell package is missing');
          const binaries = pkg.targets.filter(target => target.kind.includes('bin')).map(target => target.name).sort();
          const entry = require('./.oi/product.json').artifact.entry;
          if (!binaries.includes(entry) || binaries.some(name => !/^[a-zA-Z0-9_-]+$/.test(name))) {
            throw new Error('native binary declaration is invalid or lacks the product entry');
          }
          process.stdout.write(binaries.join('\n') + '\n');
          NODE
          while IFS= read -r binary; do
            test -x "target/${{ matrix.target }}/release/$binary"
            cp "target/${{ matrix.target }}/release/$binary" "dist/$name/$binary"
          done < "$RUNNER_TEMP/workcell-artifact-binaries.txt"
          cp .oi/product.json "dist/$name/product.json"
          printf '%s\n' "$GITHUB_SHA" > "dist/$name/source-commit.txt"
          (
            cd "dist/$name"
            while IFS= read -r binary; do
              shasum -a 256 "$binary"
            done < "$RUNNER_TEMP/workcell-artifact-binaries.txt"
            shasum -a 256 product.json source-commit.txt
          ) > "dist/$name/SHA256SUMS"
          (cd "dist/$name" && shasum -a 256 -c SHA256SUMS)
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: workcell-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
