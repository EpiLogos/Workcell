name: W26 format additions

on:
  push:
    branches:
      - feat/opensandbox-world-hosting-43

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/opensandbox-world-hosting-43
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format W26 Rust additions
        run: cargo fmt --all
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/workcell-opensandbox/src/composition.rs crates/workcell-opensandbox/src/data_plane.rs
          git commit -m "W26: format material composition additions"
          git push origin HEAD:feat/opensandbox-world-hosting-43
