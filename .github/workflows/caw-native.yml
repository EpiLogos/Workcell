name: CAW native material campaign

on:
  pull_request:
    paths: ['Cargo.*', 'crates/**', 'scripts/**', '.github/workflows/caw-native.yml']
  push:
    branches: [main]
    paths: ['Cargo.*', 'crates/**', 'scripts/**', '.github/workflows/caw-native.yml']

env:
  # Explicit hosted staging exception; this is not a native Project/Run.
  WORKCELL_TEST_ARTIFACT_ROOT: ${{ github.workspace }}/evidence/native-processes
  WORKCELL_TEST_ARTIFACT_ADMISSION: hosted-runner
  WORKCELL_TEST_ARTIFACT_OWNER_SOURCE: ${{ github.workspace }}/evidence/source-commit.txt

permissions:
  contents: read

concurrency:
  group: caw-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-material:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Record exact tested source and environment
        run: |
          mkdir -p "$WORKCELL_TEST_ARTIFACT_ROOT"
          git rev-parse HEAD > evidence/source-commit.txt
          printf 'WORKCELL_TEST_ARTIFACT_OWNER_REF=%s\n' "$(cat evidence/source-commit.txt)" >> "$GITHUB_ENV"
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > evidence/pr-head.txt
          rustc --version --verbose > evidence/toolchain.txt
          uname -a > evidence/kernel.txt
          git archive --format=tar.gz HEAD > evidence/source.tar.gz
      - name: Formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Native workspace tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace --all-targets 2>&1 | tee evidence/native-tests.txt
      - name: Required positive kernel confinement
        env:
          WORKCELL_REQUIRE_LANDLOCK: '1'
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p epilogos-workcell-runtime --test write_boundary -- --nocapture 2>&1 | tee evidence/write-boundary.txt
          grep -q WRITE_BOUNDARY_EXECUTED evidence/write-boundary.txt
          grep -q PROTECTED_SOURCE_EXECUTED evidence/write-boundary.txt
      - name: Build native operations
        run: |
          cargo build --locked -p epilogos-workcell-cli --bins
          cp target/debug/workcell target/debug/workcell-control-service target/debug/workcell-write-boundary evidence/
          sha256sum evidence/workcell evidence/workcell-control-service evidence/workcell-write-boundary > evidence/binary-sha256.txt
      - name: Current readonly input and Task-owned runtime kernel cases
        timeout-minutes: 10
        shell: bash
        env:
          WORKCELL_REQUIRE_LANDLOCK: '1'
          WORKCELL_RUNTIME_PROJECTION_BIN: ${{ github.workspace }}/target/debug/workcell-write-boundary
          WORKCELL_TEST_ARTIFACT_ROOT: ${{ github.workspace }}/evidence/native-processes
          WORKCELL_TEST_ARTIFACT_OWNER_SOURCE: ${{ github.workspace }}/evidence/source-commit.txt
          WORKCELL_TEST_ARTIFACT_ADMISSION: 'hosted-runner'
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          export RUNTIME_GATE_EVIDENCE="$GITHUB_WORKSPACE/evidence/runtime-projection"
          mkdir -p "$RUNTIME_GATE_EVIDENCE/images" "$WORKCELL_TEST_ARTIFACT_ROOT"
          export WORKCELL_TEST_ARTIFACT_OWNER_REF="$(cat evidence/source-commit.txt)"
          cp Cargo.lock "$RUNTIME_GATE_EVIDENCE/Cargo.lock"
          git rev-parse HEAD^{tree} > "$RUNTIME_GATE_EVIDENCE/source-tree.txt"
          git ls-files --stage > "$RUNTIME_GATE_EVIDENCE/source-modes.txt"
          sha256sum Cargo.lock crates/workcell-runtime/Cargo.toml crates/workcell-cli/Cargo.toml crates/workcell-runtime/src/runtime_projection.rs crates/workcell-runtime/tests/runtime_projection.rs > "$RUNTIME_GATE_EVIDENCE/source-sha256.txt"
          record_command() {
            local label=$1 suffix=$2 status
            shift 2
            printf '%q ' "$@" > "$RUNTIME_GATE_EVIDENCE/$label.command.txt"
            printf '\n' >> "$RUNTIME_GATE_EVIDENCE/$label.command.txt"
            set +e
            "$@" > "$RUNTIME_GATE_EVIDENCE/$label.$suffix" 2> "$RUNTIME_GATE_EVIDENCE/$label.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" > "$RUNTIME_GATE_EVIDENCE/$label.exit"
            return "$status"
          }
          record_command compiler-owner jsonl timeout --kill-after=5s 5m cargo build --locked -p epilogos-workcell-cli --bins --message-format=json
          record_command compiler-test jsonl timeout --kill-after=5s 5m cargo test --locked -p epilogos-workcell-runtime --test runtime_projection --no-run --message-format=json
          cat > "$RUNTIME_GATE_EVIDENCE/audit.py" <<'PY'
          import hashlib,json,os,stat,sys
          from pathlib import Path
          out=Path(os.environ['RUNTIME_GATE_EVIDENCE'])
          roles=json.loads(os.environ['RUNTIME_GATE_ROLES'])
          def write(name,value):
              (out/name).write_text(json.dumps(value,indent=2)+'\n')
          def facts(s):
              return dict(device=s.st_dev,inode=s.st_ino,mode=s.st_mode,links=s.st_nlink,
                          uid=s.st_uid,gid=s.st_gid,bytes=s.st_size,mtime_ns=s.st_mtime_ns,ctime_ns=s.st_ctime_ns)
          def held(path,root,copy=None,limit=1073741824):
              p=Path(path); row={'path':str(p),'sha256':None,'cause':None}
              try:
                  row['named_before']=facts(os.lstat(p))
                  if not p.is_absolute() or not p.is_relative_to(root) or p.resolve(strict=True)!=p:
                      raise ValueError('image/source coordinate is outside the exact admitted physical root')
                  fd=os.open(p,os.O_RDONLY|os.O_NONBLOCK|os.O_NOFOLLOW|os.O_CLOEXEC)
                  with os.fdopen(fd,'rb') as f:
                      first=os.fstat(f.fileno());row['held_before']=facts(first)
                      if not stat.S_ISREG(first.st_mode) or first.st_uid!=os.geteuid() or first.st_size>limit:
                          raise ValueError('nonregular/foreign-owner/over-capacity original; no byte read admitted')
                      digest=hashlib.sha256();observed=0;prefix=b''
                      sink=None
                      if copy is not None:
                          sink=os.fdopen(os.open(copy,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o700),'wb')
                      try:
                          while chunk:=f.read(1048576):
                              if not prefix:prefix=chunk[:64]
                              observed+=len(chunk)
                              if observed>limit:raise ValueError('held image exceeded admitted capacity')
                              digest.update(chunk)
                              if sink:sink.write(chunk)
                          if sink:sink.flush()
                      finally:
                          if sink:sink.close()
                      row['held_after']=facts(os.fstat(f.fileno()));row['named_after']=facts(os.lstat(p))
                      if row['held_before']!=row['held_after'] or row['held_before']!=row['named_before'] or row['held_after']!=row['named_after']:
                          raise ValueError('held/named original basis changed; digest unavailable')
                      row['sha256']=digest.hexdigest();row['observed_bytes']=observed;row['header_hex']=prefix.hex()
                      if copy is not None:
                          s=os.lstat(copy);row['private_copy']=dict(path=str(copy),metadata=facts(s))
                          if not stat.S_ISREG(s.st_mode) or s.st_nlink!=1:
                              raise ValueError('private evidence copy must be regular single-link')
                  row['digest_standing']='bounded unchanged held regular original; native original link count is observed, not presumed one'
              except (OSError,ValueError) as e:
                  row['sha256']=None
                  row['cause']={'type':type(e).__name__,'errno':getattr(e,'errno',None),'message':str(e)}
              return row
          def artifacts(file):
              used=0;result=[]
              with Path(file).open('rb') as stream:
                  for raw in stream:
                      used+=len(raw)
                      if used>67108864 or len(raw)>1048576:raise ValueError('compiler receipt capacity exceeded')
                      item=json.loads(raw)
                      if item.get('reason')=='compiler-artifact':result.append(item)
              return result
          mode=sys.argv[1]
          if mode=='prepare':
              records=[];total=0
              for role in roles:
                  rows=[r for r in artifacts(out/role['receipt']) if r['target']['name']==role['target'] and r.get('executable')]
                  if len(rows)!=1:raise ValueError('exactly one actual CompilerArtifact is required for '+role['name'])
                  artifact=rows[0];root=Path(role['root']);image=Path(artifact['executable'])
                  row={'role':role,'compiler_artifact':artifact,'image':held(image,root/'target'/role.get('profile_dir','debug'),out/'images'/role['name'],min(1073741824,3221225472-total))}
                  # Safe physical digest precedes semantic role/profile/source checks.
                  records.append(row);write('images.before.json',records)
                  if row['image']['cause']:raise ValueError('original image admission failed; native cause retained')
                  if not row['image']['header_hex'].startswith('7f454c46') or not row['image']['held_before']['mode']&0o111:
                      raise ValueError('selected Linux native image is not an executable ELF')
                  total+=row['image']['observed_bytes']
                  if total>3221225472:raise ValueError('aggregate copied image capacity exceeded')
                  if role['kind'] not in artifact['target']['kind'] or artifact['profile']['test']!=role['test']:
                      raise ValueError('actual Cargo target/profile differs from selected native role')
                  if 'codex-account-native' in artifact.get('features',[]):raise ValueError('credential-free gate cannot select account feature')
                  src=Path(artifact['target']['src_path']);manifest=Path(artifact['manifest_path'])
                  row['source']=held(src,root);row['manifest']=held(manifest,root)
                  write('images.before.json',records)
                  if row['source']['cause'] or row['manifest']['cause']:raise ValueError('actual compiled source/manifest unavailable')
                  if role['test']:
                      (out/'test-image.path').write_text(str(image)+'\n')
              write('images.before.json',records)
              archive_rows=[]
              for path in json.loads(os.environ['RUNTIME_GATE_SOURCE_ARCHIVES']):
                  archive_rows.append(held(path,Path(path).parent))
                  write('source-archives.json',archive_rows)
                  if archive_rows[-1]['cause']:raise ValueError('actual source archive digest unavailable')
              write('build-environment.json',{name:os.environ.get(name) for name in ['RUSTFLAGS','RUSTC_WRAPPER','CARGO_TARGET_DIR','CARGO_BUILD_TARGET','CI','GITHUB_RUN_ID','GITHUB_REPOSITORY','GITHUB_SHA']})
          elif mode=='after':
              before=json.loads((out/'images.before.json').read_text());rows=[];failed=False
              for row in before:
                  now=held(row['image']['path'],Path(row['role']['root'])/'target'/row['role'].get('profile_dir','debug'))
                  same=now['sha256']==row['image']['sha256'] and now.get('held_before')==row['image'].get('held_before')
                  rows.append({'role':row['role'],'image':now,'same_before_basis':same});failed|=not same
              write('images.after.json',rows)
              if failed:raise ValueError('selected original image basis changed across actual cases')
          elif mode=='roster':
              expected=json.loads(os.environ['RUNTIME_GATE_CASES'])
              names=[line[:-6] for line in (out/'roster.stdout').read_text().splitlines() if line.endswith(': test')]
              write('roster.json',{'actual':names,'required_selected':expected,'actual_total':len(names),'required_selected_total':len(expected)})
              if len(names)!=len(set(names)) or not set(expected).issubset(names):raise ValueError('missing/duplicate compiled case')
              if len(names)!=int(os.environ['RUNTIME_GATE_TOTAL']):raise ValueError('compiled case census changed')
          elif mode=='case':
              case=sys.argv[2];prefix=out/case;code=int(prefix.with_suffix('.exit').read_text())
              body=prefix.with_suffix('.stdout').read_text()
              ok=code==0 and any(line.startswith('test result: ok. 1 passed; 0 failed; 0 ignored;') for line in body.splitlines())
              row={'case':case,'exit_status':code,'exact_one_pass_zero_failed_ignored':ok,'stdout':str(prefix.with_suffix('.stdout')),'stderr':str(prefix.with_suffix('.stderr')),'test_image':(out/'test-image.path').read_text().strip(),'outer_timeout_seconds':120,'standing':'foreground test-harness status/raw files; inner native EOF and retirement are asserted by the actual case, not inferred from a shell status'}
              write(case+'.result.json',row)
              if not ok:raise ValueError('actual selected native case failed; no unsupported-kernel skip')
          elif mode=='snapshot':
              base=Path(os.environ['WORKCELL_TEST_ARTIFACT_ROOT']);rows=[];count=0;total=0
              # Do not feed a retained adverse FIFO/symlink to artifact streaming.
              pending=[base];dest=out/'fixture-snapshot';dest.mkdir(exist_ok=True)
              while pending:
                  directory=pending.pop()
                  for p in sorted(directory.iterdir()):
                      count+=1
                      if count>4096:raise ValueError('fixture snapshot entry capacity exceeded')
                      s=os.lstat(p);rel=p.relative_to(base);row={'relative':str(rel),'metadata':facts(s),'sha256':None}
                      if stat.S_ISDIR(s.st_mode):pending.append(p)
                      elif stat.S_ISREG(s.st_mode):
                          copy=dest/rel;copy.parent.mkdir(parents=True,exist_ok=True)
                          row['reading']=held(p,base,copy,min(4194304,67108864-total));row['sha256']=row['reading']['sha256']
                          total+=row['reading'].get('observed_bytes',0)
                          if row['reading']['cause'] or total>67108864:raise ValueError('fixture payload snapshot unavailable/over capacity')
                      else:
                          row['digest_standing']='not admitted for byte reading; retained type/identity only'
                          if stat.S_ISLNK(s.st_mode):row['link_target']=os.readlink(p)
                      rows.append(row);write('fixture-snapshot.json',{'entries':rows,'entry_count':count,'copied_regular_bytes':total,'standing':'owned controlled fixture snapshot; original FIFO/aliases remain on runner, no nonregular byte read or external atomic exclusion claim'})
          else:raise ValueError('unrecognised evidence operation')
          PY
          export RUNTIME_GATE_ROLES="[{\"name\":\"workcell\",\"receipt\":\"compiler-owner.jsonl\",\"root\":\"$GITHUB_WORKSPACE\",\"target\":\"workcell\",\"kind\":\"bin\",\"test\":false,\"profile_dir\":\"debug\"},{\"name\":\"workcell-control-service\",\"receipt\":\"compiler-owner.jsonl\",\"root\":\"$GITHUB_WORKSPACE\",\"target\":\"workcell-control-service\",\"kind\":\"bin\",\"test\":false,\"profile_dir\":\"debug\"},{\"name\":\"workcell-write-boundary\",\"receipt\":\"compiler-owner.jsonl\",\"root\":\"$GITHUB_WORKSPACE\",\"target\":\"workcell-write-boundary\",\"kind\":\"bin\",\"test\":false,\"profile_dir\":\"debug\"},{\"name\":\"runtime_projection\",\"receipt\":\"compiler-test.jsonl\",\"root\":\"$GITHUB_WORKSPACE\",\"target\":\"runtime_projection\",\"kind\":\"test\",\"test\":true,\"profile_dir\":\"debug\"}]"
          export RUNTIME_GATE_SOURCE_ARCHIVES="[\"$GITHUB_WORKSPACE/evidence/source.tar.gz\"]"
          python3 "$RUNTIME_GATE_EVIDENCE/audit.py" prepare
          test_image=$(cat "$RUNTIME_GATE_EVIDENCE/test-image.path")
          record_command() {
            local label=$1 suffix=$2 status
            shift 2
            printf '%q ' "$@" > "$RUNTIME_GATE_EVIDENCE/$label.command.txt"
            printf '\n' >> "$RUNTIME_GATE_EVIDENCE/$label.command.txt"
            set +e
            "$@" > "$RUNTIME_GATE_EVIDENCE/$label.$suffix" 2> "$RUNTIME_GATE_EVIDENCE/$label.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" > "$RUNTIME_GATE_EVIDENCE/$label.exit"
            return "$status"
          }
          record_command roster stdout timeout --kill-after=5s 30s "$test_image" --ignored --list --format terse
          export RUNTIME_GATE_CASES='["actual_original_input_is_readonly_and_task_history_reentry_is_durable","actual_redirected_runtime_never_writes_the_foreign_directory","actual_immutable_input_redirect_refuses_before_material_or_body","actual_readonly_runtime_file_retains_native_permission_cause","actual_projection_fifo_hardlink_and_digest_refuse_without_blocking_read","actual_unchanged_requested_input_alias_preserves_original_origin","actual_requested_input_alias_retarget_refuses_before_setup","actual_missing_requested_input_retains_resolution_cause"]'
          export RUNTIME_GATE_TOTAL=8
          python3 "$RUNTIME_GATE_EVIDENCE/audit.py" roster
          failed=0
          while IFS= read -r case_name; do
            set +e
            timeout --kill-after=5s 120s "$test_image" "$case_name" --ignored --exact --nocapture --test-threads=1 > "$RUNTIME_GATE_EVIDENCE/$case_name.stdout" 2> "$RUNTIME_GATE_EVIDENCE/$case_name.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" > "$RUNTIME_GATE_EVIDENCE/$case_name.exit"
            cat "$RUNTIME_GATE_EVIDENCE/$case_name.stdout"
            cat "$RUNTIME_GATE_EVIDENCE/$case_name.stderr" >&2
            if ! python3 "$RUNTIME_GATE_EVIDENCE/audit.py" case "$case_name"; then failed=1; fi
          done <<'CASES'
          actual_original_input_is_readonly_and_task_history_reentry_is_durable
          actual_redirected_runtime_never_writes_the_foreign_directory
          actual_immutable_input_redirect_refuses_before_material_or_body
          actual_readonly_runtime_file_retains_native_permission_cause
          actual_projection_fifo_hardlink_and_digest_refuse_without_blocking_read
          actual_unchanged_requested_input_alias_preserves_original_origin
          actual_requested_input_alias_retarget_refuses_before_setup
          actual_missing_requested_input_retains_resolution_cause
          CASES
          if ! python3 "$RUNTIME_GATE_EVIDENCE/audit.py" after; then failed=1; fi
          if ! python3 "$RUNTIME_GATE_EVIDENCE/audit.py" snapshot; then failed=1; fi
          test "$failed" = 0
          git diff --exit-code -- Cargo.lock Cargo.toml crates/
      - name: Compiled protected-source and stdio boundaries
        shell: bash
        env:
          WORKCELL_CAW_BOUNDARY: ${{ github.workspace }}/target/debug/workcell-write-boundary
          WORKCELL_REQUIRE_LANDLOCK: '1'
        run: |
          set -o pipefail
          python3 -m unittest -v scripts/test_caw_protected_sources.py scripts/test_caw_stdio_boundary.py scripts/test_caw_protocol_boundary.py 2>&1 | tee evidence/protected-sources.txt
          grep -q PROTECTED_SOURCE_EXECUTED evidence/protected-sources.txt
          grep -q STDIO_BOUNDARY_EXECUTED evidence/protected-sources.txt
          grep -q PROTECTED_PROTOCOL_EXECUTED evidence/protected-sources.txt
      - name: Compiled service restart and provider substitution
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/caw_native_campaign.py --bin-dir target/debug --output evidence/material-campaign.json 2>&1 | tee evidence/material-campaign.txt
          python3 -m py_compile scripts/caw_installed_world.py
          PYTHONPATH=scripts python3 -m unittest -v scripts/test_caw_installed_world.py 2>&1 | tee evidence/procedure-safety.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caw-native-${{ github.sha }}
          path: |
            evidence/
            !evidence/native-processes/**
          retention-days: 7

  native-target-instance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native Linux ACL test instrument
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y acl
      - name: Stage owned native evidence
        shell: bash
        run: |
          mkdir -p "$WORKCELL_TEST_ARTIFACT_ROOT"
          git rev-parse HEAD > evidence/source-commit.txt
          printf 'WORKCELL_TEST_ARTIFACT_OWNER_REF=%s\n' "$(cat evidence/source-commit.txt)" >> "$GITHUB_ENV"
          rustc --version --verbose > evidence/toolchain.txt
          uname -a > evidence/kernel.txt
      - name: Compile and retain actual native39 Source and test images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 evidence/native39
          mkdir -m 700 evidence/native39/images
          git archive --format=tar.gz HEAD > evidence/native39-source.tar.gz
          cp Cargo.lock evidence/native39-Cargo.lock
          git ls-tree -r HEAD > evidence/native39-source-modes.txt
          git status --porcelain=v1 --untracked-files=no > evidence/native39-source-before.status
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > evidence/native39-requested-head.txt
          cat > evidence/native39/audit.py <<'PY'
          import hashlib,json,os,stat,sys
          from pathlib import Path
          workspace=Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          out=workspace/'evidence/native39'
          root_before=os.stat(workspace)
          owner=os.stat(out)
          owner_fd=os.open(out,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW|os.O_CLOEXEC)
          image_dir=out/'images'
          image_owner=os.lstat(image_dir)
          image_fd=os.open(image_dir,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW|os.O_CLOEXEC)
          def facts(s):
              return dict(device=s.st_dev,inode=s.st_ino,mode=s.st_mode,links=s.st_nlink,
                          uid=s.st_uid,gid=s.st_gid,bytes=s.st_size,mtime_ns=s.st_mtime_ns,ctime_ns=s.st_ctime_ns)
          def current_owner():
              r=os.stat(workspace);n=os.lstat(out);h=os.fstat(owner_fd)
              if (r.st_dev,r.st_ino)!=(root_before.st_dev,root_before.st_ino) or not stat.S_ISDIR(n.st_mode):
                  raise ValueError('hosted workspace/evidence owner affiliation changed')
              if (n.st_dev,n.st_ino)!=(owner.st_dev,owner.st_ino) or (h.st_dev,h.st_ino)!=(owner.st_dev,owner.st_ino):
                  raise ValueError('held/named evidence directory affiliation changed')
              i=os.lstat(image_dir);ih=os.fstat(image_fd)
              if not stat.S_ISDIR(i.st_mode) or (i.st_dev,i.st_ino)!=(image_owner.st_dev,image_owner.st_ino) or (ih.st_dev,ih.st_ino)!=(image_owner.st_dev,image_owner.st_ino):
                  raise ValueError('held/named exclusive image-copy directory changed')
          def save(name,value):
              current_owner()
              fd=os.open(name,os.O_WRONLY|os.O_CREAT|os.O_NOFOLLOW|os.O_NONBLOCK|os.O_CLOEXEC,0o600,dir_fd=owner_fd)
              with os.fdopen(fd,'w',encoding='utf-8') as f:
                  s=os.fstat(f.fileno())
                  if not stat.S_ISREG(s.st_mode) or s.st_nlink!=1:raise ValueError('evidence record must be ordinary single-link')
                  os.ftruncate(f.fileno(),0)
                  json.dump(value,f,indent=2);f.write('\n');f.flush();os.fsync(f.fileno())
              current_owner()
          def observe(path,allowed_root,copy=None,executable=False,limit=None,single_link=True,copy_root=None):
              p=Path(path);row={'path':str(p),'sha256':None,'cause':None};copy_fd=None
              try:
                  current_owner();row['named_before']=facts(os.lstat(p))
                  if not p.is_absolute() or not p.is_relative_to(allowed_root) or p.resolve(strict=True)!=p:
                      raise ValueError('selected coordinate is outside its actual canonical hosted root')
                  parent_before=os.stat(p.parent)
                  fd=os.open(p,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK|os.O_CLOEXEC)
                  with os.fdopen(fd,'rb') as f:
                      initial=os.fstat(f.fileno());row['held_before']=facts(initial)
                      if not stat.S_ISREG(initial.st_mode) or (single_link and initial.st_nlink!=1) or initial.st_uid!=os.geteuid():
                          raise ValueError('selected evidence/image violates its ordinary/owner/link admission')
                      if limit is not None and initial.st_size>limit:raise ValueError('ordinary snapshot exceeds admitted finite capacity; no body read')
                      if copy_root is not None:row['copy_admitted_bytes']=initial.st_size
                      if executable and not initial.st_mode&0o111:raise ValueError('actual test image lacks native execute mode')
                      if row['named_before']!=row['held_before']:raise ValueError('named/held basis differs before bytes')
                      digest=hashlib.sha256();remaining=initial.st_size;observed=0
                      sink=None
                      if copy is not None:
                          destination_fd=image_fd
                          if copy_root is None:
                              if copy.parent!=image_dir:raise ValueError('copy must remain under exact held image directory')
                          else:
