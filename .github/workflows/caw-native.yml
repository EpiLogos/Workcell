name: CAW native material campaign

on:
  pull_request:
    paths:
      - 'Cargo.*'
      - 'crates/**'
      - 'scripts/**'
      - '.github/workflows/caw-native.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.*'
      - 'crates/**'
      - 'scripts/**'
      - '.github/workflows/caw-native.yml'

permissions:
  contents: read

jobs:
  native-material:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Record exact public source and toolchain
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          rustc --version --verbose > evidence/toolchain.txt
          git archive --format=tar.gz HEAD > evidence/source.tar.gz
      - name: Pinned owner continuation and offline reproduction inputs
        if: github.head_ref == 'agent/caw-w9-material-lifecycle'
        run: |
          git fetch --no-tags origin 499bf81be9d0eed8770f92e31ec7d29c15bce101
          git archive --format=tar.gz FETCH_HEAD > evidence/service-owner-source.tar.gz
          git fetch --no-tags origin fa47a29fa49a6636675d21309b00c269ac824abb
          git archive --format=tar.gz FETCH_HEAD > evidence/service-merge-base.tar.gz
          cargo vendor --locked offline-vendor > evidence/vendor-config.toml
          tar -czf evidence/vendor.tar.gz offline-vendor
          tar -czf evidence/toolchain.tar.gz -C "$(rustc --print sysroot)" bin lib
      - uses: actions/upload-artifact@v4
        with:
          name: caw-reproduction-${{ github.sha }}
          path: evidence/
          retention-days: 1
      - name: Native workspace tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace --all-targets 2>&1 | tee evidence/native-tests.txt
      - name: Build native campaign entrypoints
        run: |
          cargo build --locked -p epilogos-workcell-cli --bins
          cp target/debug/workcell target/debug/workcell-control-service evidence/
          sha256sum evidence/workcell evidence/workcell-control-service > evidence/binary-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caw-native-${{ github.sha }}
          path: |
            evidence/source-commit.txt
            evidence/toolchain.txt
            evidence/source.tar.gz
            evidence/native-tests.txt
            evidence/workcell
            evidence/workcell-control-service
            evidence/binary-sha256.txt
          retention-days: 7
