name: W26 expose volume wire conversion

on:
  push:
    branches:
      - feat/opensandbox-world-hosting-43

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/opensandbox-world-hosting-43
          fetch-depth: 1
      - name: Expose provider-native volume conversion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/workcell-opensandbox/src/volume.rs')
          text = path.read_text()
          old = '    pub(crate) fn wire_value(&self) -> Result<Value> {'
          new = '    pub fn wire_value(&self) -> Result<Value> {'
          if old not in text:
              raise SystemExit('expected private volume wire conversion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all -- --check
      - name: Commit focused patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/workcell-opensandbox/src/volume.rs
          git commit -m "W26: expose provider-native volume conversion"
          git push origin HEAD:feat/opensandbox-world-hosting-43
