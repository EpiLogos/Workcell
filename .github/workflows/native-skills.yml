name: Native Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/verify-native-skills.sh"
      - "crates/workcell-core/src/secret.rs"
      - "crates/workcell-sdk/**"
      - ".github/workflows/native-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/verify-native-skills.sh"
      - "crates/workcell-core/src/secret.rs"
      - "crates/workcell-sdk/**"
      - ".github/workflows/native-skills.yml"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The sdk_conformance and material_world tests run in verify.yml's
      # whole-workspace test; only the Skills check is unique here.
      - run: bash scripts/verify-native-skills.sh
