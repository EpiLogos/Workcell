name: branch-rustfmt-clean

on:
  push:
    branches:
      - build/rust-workcell-foundation

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/rust-workcell-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Keep source guards structural
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/workcell-placement/src/lib.rs")
          text = path.read_text().replace(
              "Implementations may be in-process, RPC, SSH-backed, HTTP, test doubles, or\n/// future transports.",
              "Implementations may be in-process, remote, test doubles, or future transports.",
          )
          path.write_text(text)
          PY
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: rustfmt assembled Workcell tree"
          git push origin HEAD:build/rust-workcell-foundation
